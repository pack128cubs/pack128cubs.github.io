# Pack 128 events, 2026-27 program year
# Sources: "2026-2027 Pack Meetings_Events" planning sheet, updated where the
# October 2026 committee minutes are newer (campout location, October roundtable
# date, district campout). Replace with the pack's Google Calendar once it is
# connected (see README.md).
#
# Format:
#   - title: Event name
#     start: 2026-10-22            all-day event, or
#     start: 2026-11-01 17:00      timed event (24-hour clock, no seconds)
#     end:   last day (all-day) or end time (timed). Optional.
#     location: shown publicly unless audience is "members"
#     description: plain text or simple HTML
#     audience: public (default) or members (den events; hides the location)
#
# Never list a youth's name, or anyone's personal phone or email, here.

