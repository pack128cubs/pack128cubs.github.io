---
layout: default
hideTitle: true
---

<div class="border-b border-gray-300 flex flex-col min-h-14 pb-4">
  <h1 class="text-4xl font-extrabold text-cub-gold my-auto tracking-[0.2em] uppercase">{{ page.title }}</h1>

  <h2 class="text-2xl font-bold text-cub-blue mt-4">{% include event-when.html ev=page.event %}</h2>

  <h3 class="text-xl font-semibold text-slate-700 mt-0">LOCATION AVAILABLE IN MEMBERS CALENDAR</h3>
</div>

<div class="prose mt-8">
  {% if page.event.description %}
    {{ page.event.description }}
  {% endif %}
</div>

<div class="mt-8 flex gap-4">
  <a href="{{ '/calendar/' | relative_url }}" class="inline-flex items-center rounded-lg px-4 py-2 bg-slate-100 text-slate-800 font-semibold hover:bg-slate-200 transition">&larr; Back to Calendar</a>
</div>
